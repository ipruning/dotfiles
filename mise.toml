# Use the current mise lockfile format and native dependency sidecars.
min_version = { hard = "2026.9.18" }

[tool_alias]
actionlint = "aqua:rhysd/actionlint"
fd = "aqua:sharkdp/fd"
jq = "aqua:jqlang/jq"
ripgrep = "aqua:BurntSushi/ripgrep"
rumdl = "aqua:rvben/rumdl"
shellcheck = "aqua:koalaman/shellcheck"
tombi = "aqua:tombi-toml/tombi"
uv = "aqua:astral-sh/uv"
zizmor = "aqua:zizmorcore/zizmor"

[settings]
# Bootstrap is explicit; task, exec, and command-not-found paths must not
# install tools as a side effect before their own preview/apply contract starts.
auto_install = false
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tools]
# fd, jq, and ripgrep serve the module test suites that verify depends on.
actionlint = "1.7.12"
fd = "10.5.0"
jq = "1.8.2"
python = "3.15.0"
ripgrep = "15.2.0"
rumdl = "0.2.79"
shellcheck = "0.11.0"
tombi = "1.8.4"
uv = "0.13.1"
zizmor = "1.30.1"

[env]
# mise sets VIRTUAL_ENV only once .venv exists. Python tasks call that
# interpreter directly because mise inserts its PATH entries where the shims
# directory sits, which can be after /usr/bin (Omarchy's login PATH does this).
_.python.venv = { path = ".venv" }

[tasks.diff]
description = "Report configuration drift without changing files"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.diff "$@"'

[tasks.restore]
description = "Preview or apply one reference application"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.restore "$@"'

[tasks.adopt]
description = "Preview or adopt one application's live configuration into the reference"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.adopt "$@"'

[tasks.check]
description = "Inspect this host's required and optional capabilities"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.check "$@"'

[tasks.doctor]
description = "Aggregate read-only repository and host health checks"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.doctor "$@"'

[tasks.clean]
description = "Preview or apply package-manager cleanup"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.clean "$@"'

[tasks.setup-linux-lite]
description = "Preview or apply the Linux Lite Bash startup block and Git include"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.setup_linux_lite "$@"'

[tasks.update]
description = "Preview or apply host tool updates"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.update "$@"'

[tasks.upgrade-tools]
description = "Preview or advance the shared mise and Yazi plugin baselines on the maintenance host"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.upgrade_tools "$@"'

[tasks.upgrade-all]
description = "Preview or apply a full software upgrade and verification"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.upgrade_all "$@"'

[tasks.mise-sync]
description = "Preview or converge global mise configuration, locked tools, and shims"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.mise_sync "$@"'

[tasks.generate]
description = "Preview or regenerate generated/ shell integrations, completions, and plugins"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.generate "$@"'

[tasks.inventory]
description = "Preview or snapshot installed host software into inventory/<host>/"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.inventory "$@"'

[tasks.zsh-profile]
description = "Profile Zsh startup time"
run = 'scripts/zsh-profile "$@"'

[tasks.lint]
description = "Inspect repository paths, mappings, and symlinks"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.lint "$@"'

[tasks.shell]
description = "Check shell files with syntax and ShellCheck gates"
run = '"${VIRTUAL_ENV:+$VIRTUAL_ENV/bin/}python" -m scripts.shell "$@"'

[tasks.format]
description = "Check Python, TOML, and Markdown formatting and style"
run = [
    "ruff check scripts tests",
    "ruff format --check scripts tests",
    # Offline: verify never fetches TOML schemas.
    "tombi format --check --offline",
    "tombi lint --offline",
    # Reads .markdownlint-cli2.yaml.
    "rumdl check .",
]

[tasks.test]
description = "Run behavior tests"
run = "pytest"

[tasks.test-services]
description = "Run the service test suites (macOS only)"
run = """
if [ "$(uname)" != Darwin ]; then
  echo "skipped: service suites are macOS-only"
  exit 0
fi
./services/macos-session-health/macos-session-health-test
./services/macos-maxfiles/macos-maxfiles-test
./services/cursoruiviewservice-watchdog/cursoruiviewservice-watchdog-test
"""

[tasks.typecheck]
description = "Check Python types"
run = "ty check scripts tests"

[tasks.workflows]
description = "Check GitHub Actions workflows for errors and security issues"
run = ["actionlint", "zizmor --offline .github/workflows"]

[tasks.verify]
description = "Run all repository verification"
depends = ["format", "lint", "shell", "typecheck", "test", "test-services", "workflows"]
