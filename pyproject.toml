[project]
name = "dotfiles"
version = "0.1.0"
description = "This is my dotfiles development environment"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Runtime dependencies of scripts/: ruamel-yaml (check, lint) and the pinned
    # read-only Mackup fork (diff). Pinning Mackup here — locked in uv.lock —
    # keeps it inside the explicit `uv sync --locked` bootstrap boundary instead
    # of a runtime uvx fetch. Type-only imports for the standalone modules/bin
    # scripts live in the dev group so this list stays true to what the package
    # runs.
    "mackup @ git+https://github.com/ipruning/mackup@f5b1984d9d6e9ef6d9bb0c54678f36bce4b9cdc7",
    "ruamel-yaml>=0.19.1",
]

[tool.tombi.format.rules]
indent-style = "space"
indent-width = 4

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
preview = true
target-version = "py314"

[tool.ruff.lint]
# Protocol parsers deliberately expose one domain-specific exception type for
# malformed values as well as malformed shapes.
ignore = ["TRY004"]

[tool.ruff.lint.per-file-ignores]
# These integration tests assert the child process return code explicitly.
"tests/test_modules.py" = ["PLW1510"]

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["scripts", "tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
    # Import targets so the editor/ty can resolve the standalone modules/bin
    # scripts. Each is a PEP 723 `uv run --script` with its own inline runtime
    # deps; these entries exist only to type-check them, not to run scripts/.
    "autocorrect-py>=2.14.0",
    "fire>=0.7.1",
    "loguru>=0.7.3",
    "pydantic>=2.0",
    "rich>=15.0.0",
    "tiktoken>=0.13.0",
    "typer>=0.26.8",
    "youtube-transcript-api>=1.2.4",
]
