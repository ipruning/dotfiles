[project]
name = "dotfiles"
version = "0.1.0"
description = "This is my dotfiles development environment"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    # Runtime dependencies of scripts/: ruamel-yaml (check) and the pinned
    # read-only Mackup fork (diff).
    "mackup @ git+https://github.com/ipruning/mackup@da1c75dc34e494b6884c0f000af8f93758a778d9",
    "ruamel-yaml>=0.19.1",
]

[dependency-groups]
dev = [
    # Import targets so editors can resolve the standalone commands scripts.
    # Each is a PEP 723 `uv run --script` with its own inline runtime deps; ty
    # does not check commands, and scripts/ never imports these.
    "autocorrect-py>=2.14.0",
    "fire>=0.7.1",
    "loguru>=0.7.3",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "ruff>=0.16.9",
    "tiktoken>=0.14.0",
    "ty>=0.0.84",
    "typer>=0.27.2",
    "youtube-transcript-api>=1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
preview = true
target-version = "py315"

[tool.ruff.lint]
# Families that find bugs, enforce one idiom, or modernize code. Not selected:
# S (test asserts and subprocess are this repository's job), D (docstrings),
# PLR (complexity thresholds), TC, and E501 (the formatter owns line length).
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FLY",
    "FURB",
    "G",
    "I",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PLE",
    "PLW",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "W",
    # Compose modules through public names only (see AGENTS.md).
    "PLC2701",
]
# PERF401: multi-line finding construction reads better as a loop.
# PLW1514: Python 3.15 defaults to UTF-8 mode (PEP 686).
ignore = ["E501", "PERF401", "PLW0717", "PLW1514"]

[tool.ruff.lint.per-file-ignores]
# These integration tests assert the child process return code explicitly.
"tests/test_commands.py" = ["PLW1510"]
# Test doubles mirror the signatures they replace.
"tests/**" = ["ARG"]

[tool.tombi.format.rules]
indent-style = "space"
indent-width = 4

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.environment]
python-version = "3.15"

[tool.ty.rules]
all = "error"
# Optional strings and mappings here treat empty and None alike by design
# (`which()` results, optional arguments); `is not None` would only add noise.
truthiness-test-of-none-union = "ignore"

[tool.ty.src]
include = ["scripts", "tests"]

[tool.uv]
prerelease = "disallow"
