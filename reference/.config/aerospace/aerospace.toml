config-version = 2

accordion-padding = 0
after-startup-command = ["workspace 1"]
default-root-container-layout = "accordion"
default-root-container-orientation = "vertical"
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

start-at-login = true

# TODO: When `aerospace list-apps` reports a stable bundle ID for a running
# MDPro3, replace this title-only predicate; titles may initialize too late.
on-window-detected = [
    { if = 'test "%{window-title}" ~= "MDPro3"', run = "layout floating" },
    { if = "test %{app-bundle-id} = com.apple.audio.AudioMIDISetup", run = "layout floating" },
    { if = "test %{app-bundle-id} = com.apple.ScreenSharing", run = "layout floating" },
    { if = "test %{app-bundle-id} = org.pqrs.Karabiner-Elements.Settings", run = "layout floating" },
    { if = "test %{app-bundle-id} = org.pqrs.Karabiner-EventViewer", run = "layout floating" },
]

[key-mapping]
preset = "qwerty"

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# AeroSpace treats left and right Alt as one layer, so each chord can use the
# opposite-hand modifier. Keep frequent actions there; lower-frequency window
# structure changes live behind the single-key Service Leader.
[mode.main.binding]
# Toggle passthrough with the same guarded chord in both modes so `alt-p`
# remains the Personal launcher in Main.
alt-shift-p = "mode pass"

alt-tab = "workspace-back-and-forth"
# Enter Service as a Leader: release Alt before the next command.
alt-slash = "mode service"

# Workspaces follow the focused monitor instead of being pinned to display
# names, so connecting or disconnecting a display doesn't force a reassignment.
alt-1 = "summon-workspace 1"
alt-2 = "summon-workspace 2"
alt-3 = "summon-workspace 3"
alt-4 = "summon-workspace 4"
alt-5 = "summon-workspace 5"

alt-6 = "summon-workspace 6"
alt-7 = "summon-workspace 7"
alt-8 = "summon-workspace 8"
alt-9 = "summon-workspace 9"

alt-shift-1 = "move-node-to-workspace 1"
alt-shift-2 = "move-node-to-workspace 2"
alt-shift-3 = "move-node-to-workspace 3"
alt-shift-4 = "move-node-to-workspace 4"
alt-shift-5 = "move-node-to-workspace 5"

alt-shift-6 = "move-node-to-workspace 6"
alt-shift-7 = "move-node-to-workspace 7"
alt-shift-8 = "move-node-to-workspace 8"
alt-shift-9 = "move-node-to-workspace 9"

# HJKL traverses only tiled windows. Transparent floating overlays such as
# Typeless' `Status` dialog otherwise become invisible focus targets.
alt-h = "focus --ignore-floating left --boundaries all-monitors-outer-frame"
alt-j = "focus --ignore-floating down --boundaries all-monitors-outer-frame"
alt-k = "focus --ignore-floating up --boundaries all-monitors-outer-frame"
alt-l = "focus --ignore-floating right --boundaries all-monitors-outer-frame"
alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

# App launchers use stable roles: Agent, Business, Chat, Editor, Personal,
# Research, Shell, Tasks, and Web.
alt-a = 'exec-and-forget open -a /Applications/Amp.app'
alt-b = 'exec-and-forget open -a /Applications/Lark.app'
alt-c = 'exec-and-forget open -a /Applications/Claude.app'
alt-e = 'exec-and-forget open -a /Applications/Zed.app'
alt-p = 'exec-and-forget open -a /Applications/WeChat.app'
alt-r = 'exec-and-forget open -a /Applications/Roam\ Research.app'
alt-s = 'exec-and-forget open -a /Applications/Ghostty.app'
alt-t = 'exec-and-forget open -a /Applications/Linear.app'
alt-w = 'exec-and-forget open -a /Applications/Google\ Chrome.app'

# `alt-s` activates Ghostty; `alt-enter` deliberately creates a new window.
alt-enter = '''exec-and-forget osascript -e 'tell application id "com.mitchellh.ghostty" to new window' '''

cmd-m = []
cmd-h = []

[mode.pass.binding]
alt-shift-p = "mode main"

# One-shot Leader commands return to Main. Resize stays in Service so repeated
# adjustments need no additional prefix.
[mode.service.binding]
esc = "mode main"

a = ["layout accordion vertical", "mode main"]
t = ["layout tiles vertical horizontal", "mode main"]

h = ["move-node-to-monitor --focus-follows-window left", "mode main"]
j = ["move-node-to-monitor --focus-follows-window down", "mode main"]
k = ["move-node-to-monitor --focus-follows-window up", "mode main"]
l = ["move-node-to-monitor --focus-follows-window right", "mode main"]

shift-h = ["join-with left", "mode main"]
shift-j = ["join-with down", "mode main"]
shift-k = ["join-with up", "mode main"]
shift-l = ["join-with right", "mode main"]

minus = "resize smart -50"
equal = "resize smart +50"

r = ["flatten-workspace-tree", "mode main"]
shift-r = ["reload-config", "mode main"]
backspace = ["close-all-windows-but-current", "mode main"]

f = ["layout floating tiling", "mode main"]
shift-f = ["fullscreen", "mode main"]
