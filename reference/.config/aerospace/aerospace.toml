config-version = 2

accordion-padding = 12
after-startup-command = ["workspace 6"]
default-root-container-layout = "accordion"
default-root-container-orientation = "vertical"
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]

start-at-login = true

# TODO: When `aerospace list-apps` reports a stable bundle ID for a running
# MDPro3, replace this title-only predicate; titles may initialize too late.
on-window-detected = [
    { if = 'test "%{window-title}" ~= "MDPro3"', run = "layout floating" },
    { if = "test %{app-bundle-id} = com.valvesoftware.steam", run = "layout floating" },
    { if = "test %{app-bundle-id} = uk.co.powdertoy.tpt", run = "layout floating" },
    { if = "test %{app-bundle-id} = com.xfge.LifeEasy", run = "layout floating" },
    { if = "test %{app-bundle-id} = com.xingin.discover", run = "layout floating" },
    { if = "test %{app-bundle-id} = com.apple.audio.AudioMIDISetup", run = "layout floating" },
    { if = "test %{app-bundle-id} = com.apple.ScreenSharing", run = "layout floating" },
    { if = "test %{app-bundle-id} = org.pqrs.Karabiner-Elements.Settings", run = "layout floating" },
    { if = "test %{app-bundle-id} = org.pqrs.Karabiner-EventViewer", run = "layout floating" },
    { if = "test %{app-bundle-id} = codes.rambo.VirtualBuddy", run = "layout floating" },
    { if = "test %{app-bundle-id} = com.hypergryph.arknights", run = "layout floating" },
    { if = "test %{app-bundle-id} = com.rogueamoeba.audiohijack", run = "layout floating" },
    { if = "test %{app-bundle-id} = ai.tcgcard.app", run = "layout floating" },
    { if = "test %{app-bundle-id} = com.sleeplessmind.Wooshy", run = "layout floating" },
]

[key-mapping]
preset = "qwerty"

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[workspace-to-monitor-force-assignment]
1 = ["built-in", "main"]
2 = ["built-in", "main"]
3 = ["built-in", "main"]
4 = ["built-in", "main"]
5 = ["built-in", "main"]

6 = ["secondary", "studio display", "lg ultragear", "main"]
7 = ["secondary", "studio display", "lg ultragear", "main"]
8 = ["secondary", "studio display", "lg ultragear", "main"]
9 = ["secondary", "studio display", "lg ultragear", "main"]
0 = ["secondary", "studio display", "lg ultragear", "main"]

[mode.main.binding]
alt-shift-p = "mode pass"

alt-tab = "workspace-back-and-forth"
alt-comma = "layout tiles vertical horizontal"
alt-period = "layout accordion vertical"
alt-slash = "mode service"

alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"

alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-0 = "workspace 0"

alt-shift-1 = "move-node-to-workspace 1"
alt-shift-2 = "move-node-to-workspace 2"
alt-shift-3 = "move-node-to-workspace 3"
alt-shift-4 = "move-node-to-workspace 4"
alt-shift-5 = "move-node-to-workspace 5"

alt-shift-6 = "move-node-to-workspace 6"
alt-shift-7 = "move-node-to-workspace 7"
alt-shift-8 = "move-node-to-workspace 8"
alt-shift-9 = "move-node-to-workspace 9"
alt-shift-0 = "move-node-to-workspace 0"

alt-h = "focus left --boundaries all-monitors-outer-frame"
alt-j = "focus down --boundaries all-monitors-outer-frame"
alt-k = "focus up --boundaries all-monitors-outer-frame"
alt-l = "focus right --boundaries all-monitors-outer-frame"
alt-shift-h = ["move left", "mode main"]
alt-shift-j = ["move down", "mode main"]
alt-shift-k = ["move up", "mode main"]
alt-shift-l = ["move right", "mode main"]

alt-a = 'exec-and-forget open -a ${HOME}/Applications/Chrome\ Apps.localized/Amp.app'
alt-b = 'exec-and-forget open -a /Applications/Google\ Chrome.app'
alt-c = "exec-and-forget open -a /Applications/Claude.app"
alt-g = 'exec-and-forget open -a /Applications/Ghostty.app'
alt-enter = '''exec-and-forget osascript -e 'tell application id "com.mitchellh.ghostty" to new window' '''
alt-r = 'exec-and-forget open -a /Applications/Roam\ Research.app'
alt-z = "exec-and-forget open -a /Applications/Zed.app"

cmd-m = []
cmd-h = []

[mode.pass.binding]
alt-p = "mode main"

[mode.service.binding]
esc = "mode main"

cmd-r = ["reload-config", "mode main"]

alt-h = ["move-node-to-monitor --focus-follows-window left", "mode main"]
alt-j = ["move-node-to-monitor --focus-follows-window down", "mode main"]
alt-k = ["move-node-to-monitor --focus-follows-window up", "mode main"]
alt-l = ["move-node-to-monitor --focus-follows-window right", "mode main"]

alt-shift-h = ["join-with left", "mode main"]
alt-shift-j = ["join-with down", "mode main"]
alt-shift-k = ["join-with up", "mode main"]
alt-shift-l = ["join-with right", "mode main"]

minus = "resize smart -50"
equal = "resize smart +50"

r = ["flatten-workspace-tree", "mode main"]
backspace = ["close-all-windows-but-current", "mode main"]

f = ["layout floating tiling", "mode main"]
shift-f = ["fullscreen", "mode main"]
