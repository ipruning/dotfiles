# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json

sources:
  skills: ~/.config/skillshare/skills
  extras: ~/.config/skillshare/skills/extras

mode: merge

targets:
  claude:
    skills:
      path: ~/.claude/skills
  universal:
    skills:
      path: ~/.agents/skills

extras:
- name: agents
  source: ~/.config/skillshare/skills/extras/shared
  file: AGENTS.md
  targets:
  - path: ~/.codex
    mode: copy
  - path: ~/.claude
    mode: copy
    as: CLAUDE.md
  - path: ~/.pi/agent
    mode: copy

ignore:
- '**/.DS_Store'
- '**/.git/**'

preserve_tilde_on_save: true
