[metadata]
name = "gists"
description = "List GitHub gists"
requirements = ["bat", "curl", "gh", "jq"]

[source]
command = "gh api --paginate /gists | jq -r '.[] | .files[] | .raw_url? | select(type == \"string\" and length > 0)' | sort -u"
display = "{split:/:-1}"

[preview]
command = """
tmp=$(mktemp) || exit
trap 'rm -f "$tmp"' EXIT
curl -fsSL -o "$tmp" -- '{replace:s/'/'"'"'/g}' || exit
bat -n --color=always "$tmp"
"""
