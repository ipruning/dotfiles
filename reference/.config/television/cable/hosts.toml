[metadata]
name = "hosts"
description = "List SSH hosts from config"
requirements = ["awk", "ssh"]

[source]
command = "awk '/^[[:space:]]*Host[[:space:]]+/ { for (i = 2; i <= NF; i++) if ($i !~ /[!*?]/ && !seen[$i]++) print $i }' ~/.ssh/config"

[preview]
command = "ssh -G -- '{}' 2>/dev/null | awk '$1 ~ /^(hostname|user|port|proxyjump|identityagent|identityfile|identitiesonly)$/ { print }'"

[keybindings]
enter = "actions:connect"

[actions.connect]
command = "ssh -- '{}'"
mode = "execute"
