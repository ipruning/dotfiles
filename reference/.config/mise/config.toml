# Use the current mise lockfile format and native dependency sidecars.
min_version = { hard = "2026.9.18" }

[tool_alias]
# Keep canonical tool identities pinned to explicit backends; [tools] must
# use these aliases rather than declaring the same full backend separately.
agent-browser = "npm:agent-browser"
btop = "aqua:aristocratos/btop"
gh = "aqua:cli/cli"
hunk = "aqua:modem-dev/hunk"
lazydocker = "aqua:jesseduffield/lazydocker"
lazygit = "aqua:jesseduffield/lazygit"
skillshare = "aqua:runkids/skillshare"
starship = "aqua:starship/starship"
uv = "aqua:astral-sh/uv"
xurl = "github:xdevplatform/xurl"
zoxide = "aqua:ajeetdsouza/zoxide"

[tools]
# Declare tools as "latest" (atuin stays on its fork revision). mise.lock records the exact
# versions: `mise run upgrade-tools -- --apply` bumps it here for review; `mise run update` installs
# those versions on every host. Do not rewrite these entries into exact versions.
"cargo:https://github.com/ipruning/atuin" = { version = "rev:92d869de2506ece3c8b8474d20d6a1aed5fbe4a7", crate = "atuin", bin = "atuin", locked = true }
"gem:kamal" = "latest"
"github:agavra/tuicr" = "latest"
"github:jihuanshe/linear" = { version = "latest", minimum_release_age = "0s" }
"github:larksuite/cli" = "latest"
"github:lycorp-jp/sim-use" = { version = "latest", os = ["macos"] }
# Debian ships btop 1.2/1.3, which rewrites the linked reference btop.conf on exit;
# macOS uses Homebrew's btop.
"npm:@excalidraw/cli" = { version = "latest", allow_low_downloads = "true" }
"npm:@openai/codex-security" = { version = "latest", allow_low_downloads = "true" }
"npm:agent-device" = "latest"
"npm:cf" = "latest"
"npm:yarn" = "1.22.22"
agent-browser = "latest"
argocd = "2.11.7"
btop = { version = "latest", os = ["linux"] }
bun = "latest"
deno = "latest"
gh = "latest"
go = "latest"
hunk = "latest"
lazydocker = "latest"
lazygit = "latest"
mr-boxington = { version = "latest", workflow = "release.yml@refs/heads/main" }
node = "latest"
python = "latest"
ruby = "latest"
rust = { version = "latest", mr_boxington = true }
skillshare = "latest"
starship = "latest"
uv = "latest"
xurl = "latest"
zig = "latest"
zoxide = "latest"

[settings]
auto_install = false
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
# Personal tools accept newly published releases without a waiting period.
minimum_release_age = "0s"
# Auto-trust only first-party checkout roots. Third-party repositories under
# ~/Developer/tries remain subject to per-config review and `mise trust`.
trusted_config_paths = ["~/Developer/ipruning", "~/Developer/jihuanshe"]
# Projects that pin pnpm only through package.json `packageManager` (or
# `devEngines.packageManager`) select that version without a mise config.
idiomatic_version_file_enable_tools = ["pnpm"]

[settings.ruby]
compile = false

[settings.self_update]
auto = true

[env]
_.path = ["~/.bun/bin"]
# Surge Enhanced Mode resolves hosts to fake IPs in 198.18.0.0/15, which Tombi
# (>= 1.8.5) refuses as non-public schema destinations unless trusted here.
TOMBI_SCHEMA_TRUSTED_HOSTS = "www.schemastore.org,json.schemastore.org"
