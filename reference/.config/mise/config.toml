# Native dependency sidecars beside symlinked lockfiles require mise 2026.9.11.
min_version = { hard = "2026.9.11" }

[tool_alias]
# Keep canonical tool identities pinned to explicit backends; [tools] must
# use these aliases rather than declaring the same full backend separately.
agent-browser = "aqua:vercel-labs/agent-browser"
herdr = "aqua:herdrdev/herdr"
hunk = "aqua:modem-dev/hunk"
lazydocker = "aqua:jesseduffield/lazydocker"
lazygit = "aqua:jesseduffield/lazygit"
pi = "aqua:earendil-works/pi"
pnpm = "aqua:pnpm/pnpm"
skillshare = "aqua:runkids/skillshare"
starship = "aqua:starship/starship"
uv = "aqua:astral-sh/uv"
xurl = "github:xdevplatform/xurl"
yarn = "vfox:mise-plugins/vfox-yarn"
zoxide = "aqua:ajeetdsouza/zoxide"

[tools]
"cargo:https://github.com/ipruning/atuin" = { version = "rev:38e9d788024cf36898b42fa46e7c13d8c774eede", crate = "atuin", bin = "atuin", locked = true }
"gem:kamal" = "latest"
"github:agavra/tuicr" = "latest"
"github:jihuanshe/linear" = { version = "latest", minimum_release_age = "0s" }
"github:larksuite/cli" = "latest"
"github:lycorp-jp/sim-use" = { version = "latest", os = ["macos"] }
"npm:@openai/codex-security" = { version = "latest", allow_low_downloads = true }
"npm:agent-device" = "latest"
agent-browser = "latest"
bun = "latest"
deno = "latest"
go = "latest"
herdr = "latest"
hunk = "latest"
lazydocker = "latest"
lazygit = "latest"
node = "latest"
pi = "latest"
pnpm = "latest"
python = "latest"
ruby = "latest"
rust = { version = "latest", mr_boxington = true }
skillshare = "latest"
starship = "latest"
uv = "latest"
xurl = "latest"
yarn = "latest"
zig = "latest"
zoxide = "latest"
mr-boxington = "latest"

[settings]
auto_install = false
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
# Auto-trust only first-party checkout roots. Third-party repositories under
# ~/Developer/tries remain subject to per-config review and `mise trust`.
trusted_config_paths = [
  "~/Developer/ipruning",
  "~/Developer/jihuanshe",
]

[settings.ruby]
compile = false

[env]
_.path = [
  "~/.bun/bin",
]
