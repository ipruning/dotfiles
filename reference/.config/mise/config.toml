min_version = { hard = "2026.8.0" }

[_.dotfiles.mise_sync.trusted_alias_backends]
yarn = ["vfox:mise-plugins/vfox-yarn"]

[tool_alias]
aube = "aqua:jdx/aube"
herdr = "github:herdrdev/herdr"
hunk = "aqua:modem-dev/hunk"
lazydocker = "aqua:jesseduffield/lazydocker"
lazygit = "aqua:jesseduffield/lazygit"
pnpm = "aqua:pnpm/pnpm"
uv = "aqua:astral-sh/uv"
yarn = "aqua:yarnpkg/berry"

[tools]
"aqua:yarnpkg/berry" = "latest"
"cargo:https://github.com/ipruning/atuin" = { version = "rev:f12a28548ad2189de3a06be547999493f1614a78", crate = "atuin", bin = "atuin", locked = true }
"gem:kamal" = "latest"
"github:agavra/tuicr" = "latest"
"github:earendil-works/pi" = "latest"
"github:jihuanshe/linear" = "latest"
"github:larksuite/cli" = "latest"
"github:lycorp-jp/sim-use" = "latest"
"github:runkids/skillshare" = "latest"
"go:github.com/xdevplatform/xurl" = "latest"
"npm:@openai/codex-security" = "latest"
"npm:agent-browser" = "latest"
"npm:agent-device" = "latest"
"npm:cf" = "latest"
aube = "latest"
bun = "latest"
deno = "latest"
go = "latest"
herdr = "latest"
hunk = "latest"
lazydocker = "latest"
lazygit = "latest"
node = "latest"
pnpm = "latest"
python = "latest"
ruby = "latest"
rust = "latest"
starship = "latest"
uv = "latest"
zig = "latest"
zoxide = "latest"

[settings]
auto_install = false
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
minimum_release_age = "0s"
trusted_config_paths = [
  "~/Desktop",
  "~/Developer",
  "~/Documents",
  "~/Downloads",
]

[settings.ruby]
compile = false

[env]
_.path = [
  "/opt/homebrew/opt/postgresql@18/bin",
  "~/.bun/bin",
  "~/.local/bin",
  "~/.modular/bin",
  "~/.opencode/bin",
  "~/.raindrop/bin",
]
