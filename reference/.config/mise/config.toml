min_version = { hard = "2026.8.0" }

[_.dotfiles.mise_sync.trusted_alias_backends]
yarn = ["vfox:mise-plugins/vfox-yarn"]

[tool_alias]
agent-browser = "npm:agent-browser"
aube = "aqua:jdx/aube"
herdr = "aqua:herdrdev/herdr"
hunk = "aqua:modem-dev/hunk"
lazydocker = "aqua:jesseduffield/lazydocker"
lazygit = "aqua:jesseduffield/lazygit"
pi = "aqua:earendil-works/pi"
pnpm = "aqua:pnpm/pnpm"
skillshare = "aqua:runkids/skillshare"
starship = "aqua:starship/starship"
uv = "aqua:astral-sh/uv"
xurl = "github:xdevplatform/xurl"
yarn = "aqua:yarnpkg/berry"
zoxide = "aqua:ajeetdsouza/zoxide"

[tools]
"aqua:yarnpkg/berry" = "latest"
"cargo:https://github.com/ipruning/atuin" = { version = "rev:f12a28548ad2189de3a06be547999493f1614a78", crate = "atuin", bin = "atuin", locked = true }
"gem:kamal" = "latest"
"github:agavra/tuicr" = "latest"
"github:jihuanshe/linear" = "latest"
"github:larksuite/cli" = "latest"
"github:lycorp-jp/sim-use" = { version = "latest", os = ["macos"] }
"npm:@openai/codex-security" = { version = "latest", allow_low_downloads = true }
"npm:agent-device" = "latest"
"npm:cf" = "latest"
agent-browser = "latest"
aube = "latest"
bun = "latest"
deno = "latest"
go = "latest"
herdr = "latest"
hunk = "latest"
lazydocker = "latest"
lazygit = "latest"
node = "latest"
pi = "latest"
pnpm = "latest"
python = "latest"
ruby = "latest"
rust = "latest"
skillshare = "latest"
starship = "latest"
uv = "latest"
xurl = "latest"
zig = "latest"
zoxide = "latest"

[settings]
auto_install = false
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
minimum_release_age = "0s"
trusted_config_paths = ["~/Developer"]

[settings.ruby]
compile = false

[env]
_.path = [
  "~/.bun/bin",
  "~/.local/bin",
  "~/.modular/bin",
  "~/.opencode/bin",
  "~/.raindrop/bin",
]
